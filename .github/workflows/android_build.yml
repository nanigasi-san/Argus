name: Android Build

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: external

      # Separate release/debug state; refresh it on each commit without collisions.
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/**/*.lock
            !~/.gradle/caches/**/gc.properties
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-v1-${{ github.workflow }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-v1-${{ github.workflow }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}-

      - name: Get dependencies
        run: flutter pub get

      # With no release keystore, Gradle uses the existing debug signing fallback.
      # This validates packaging only; store signing and publishing use Android Release.
      - name: Build release appbundle
        run: flutter build appbundle --release

      - name: Upload Android build
        uses: actions/upload-artifact@v7
        with:
          name: android-build-artifacts
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Save Gradle cache
        if: success() && steps.gradle-cache.outputs.cache-hit != 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/**/*.lock
            !~/.gradle/caches/**/gc.properties
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
