name: iOS E2E

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  e2e:
    name: iOS E2E
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Boot iOS Simulator
        id: simulator
        timeout-minutes: 8
        run: |
          set -euo pipefail
          simulator_udid="$(
            xcrun simctl list devices available -j |
              python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime, entries in devices.items() if "iOS" in runtime for device in entries if "iPhone" in device.get("deviceTypeIdentifier", "") and device["isAvailable"]))'
          )"
          echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"
          echo "Selected iOS Simulator: $simulator_udid"
          open -a Simulator --args -CurrentDeviceUDID "$simulator_udid"
          xcrun simctl boot "$simulator_udid" || true
          python3 scripts/run_with_timeout.py 420 xcrun simctl bootstatus "$simulator_udid" -b
          mkdir -p build/e2e/ios
          python3 scripts/run_with_timeout.py 30 xcrun simctl io "$simulator_udid" screenshot build/e2e/ios/boot-screen.png || echo "::warning::Simulator boot screenshot unavailable; continuing E2E"

      - name: Run iOS E2E
        id: e2e
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: bash scripts/run_ios_e2e.sh "$SIMULATOR_UDID"

      - name: Write E2E summary
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          {
            echo '## iOS E2E'
            echo "- Simulator: $SIMULATOR_UDID"
            echo "- Result: $E2E_OUTCOME"
            echo '- Native GPS option: disabled; headings are injected in Dart'
            echo '```text'
            for report in flutter-version.txt xcode-version.txt launch.json suites.txt results.txt test-results.json; do
              if [ -f "build/e2e/ios/$report" ]; then cat "build/e2e/ios/$report"; fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-e2e-diagnostics
          path: |
            build/integration_test/screenshots/
            build/e2e/ios/
          retention-days: 14
          if-no-files-found: warn
