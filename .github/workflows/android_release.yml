name: Android Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
  checks: read
  actions: read
concurrency:
  group: android-store-com.argus.orienteering
  cancel-in-progress: false
env:
  RELEASE_VERSION_CODE_OFFSET: ${{ vars.RELEASE_VERSION_CODE_OFFSET }}
jobs:
  gate:
    name: Validate Android release source
    if: github.actor == 'nanigasi-san' && github.triggering_actor == 'nanigasi-san'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.config.outputs.version }}
      build: ${{ steps.config.outputs.build }}
      sha: ${{ steps.config.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify main ancestry and all main CI workflows
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios_release_config.py gate --platform android
  release:
    needs: gate
    name: Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: android-release
    env:
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      RELEASE_BUILD: ${{ needs.gate.outputs.build }}
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Require all release credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/android_release.py credentials
      - name: Restore original verified AAB and receipt
        run: python3 scripts/ios_release_config.py restore --platform android
      - name: Determine whether a build is required
        id: restore
        run: python3 scripts/android_release.py restore_check
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        if: steps.restore.outputs.build_required == 'true'
        with:
          flutter-version: "3.44.1"
          channel: stable
      - name: Restore release signing key
        if: steps.restore.outputs.build_required == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: python3 scripts/android_release.py install
      - name: Build signed production AAB
        if: steps.restore.outputs.build_required == 'true'
        env:
          ARGUS_RELEASE_REQUIRE_SIGNING: "true"
        run: |
          flutter pub get
          flutter build appbundle --release --build-name "$RELEASE_VERSION" --build-number "$RELEASE_BUILD"
          cp build/app/outputs/bundle/release/app-release.aab build/android-release/app-release.aab
      - name: Verify upload signature and record original AAB hash
        if: steps.restore.outputs.build_required == 'true'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: python3 scripts/android_release.py verify
      - name: Preserve original verified AAB before upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-release-preupload-${{ github.run_attempt }}
          path: build/android-release/
          if-no-files-found: error
          retention-days: 90
      - name: Publish production release for Google review
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/android_release.py publish
      - name: Write release state
        if: always()
        run: |
          if [ -f build/android-release/receipt.json ]; then
            python3 scripts/android_release.py summary
          fi
      - name: Save original AAB and recovery receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-release-result-${{ github.run_attempt }}
          path: build/android-release/
          if-no-files-found: warn
          retention-days: 90
      - name: Remove signing material
        if: always()
        run: python3 scripts/android_release.py cleanup
