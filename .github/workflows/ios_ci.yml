name: iOS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ios-simulator-build:
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run iOS-focused Dart tests
        run: >
          flutter test
          test/ios_project_configuration_test.dart
          test/platform/notifier_test.dart
          test/platform/permission_coordinator_test.dart
          test/platform/location_service_test.dart
          test/app_lifecycle_test.dart
          test/app_controller_test.dart
          test/qr/geojson_qr_codec_test.dart

      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug

      - name: Run native XCTest target
        run: |
          set -euo pipefail
          simulator_udid="$(
            xcrun simctl list devices available -j |
              python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in devices.values() for device in runtime if device["name"].startswith("iPhone")))'
          )"
          xcrun simctl boot "$simulator_udid" || true
          xcrun simctl bootstatus "$simulator_udid" -b
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$simulator_udid" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run monitoring flow through native iOS channels
        run: |
          set -euo pipefail
          simulator_udid="$(
            xcrun simctl list devices booted -j |
              python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in devices.values() for device in runtime))'
          )"
          xcrun simctl install "$simulator_udid" build/ios/iphonesimulator/Runner.app
          xcrun simctl privacy "$simulator_udid" grant location-always com.argus.orienteering
          (
            while true; do
              xcrun simctl location "$simulator_udid" set 35.681236,139.767125
              sleep 2
            done
          ) &
          location_injector_pid=$!
          trap 'kill "$location_injector_pid" 2>/dev/null || true' EXIT
          flutter drive --no-pub \
            --driver=test_driver/ui_smoke_driver.dart \
            --target=integration_test/monitoring_review_geojson_test.dart \
            -d "$simulator_udid"
