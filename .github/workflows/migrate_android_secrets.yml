          MJ5x
          -----END CERTIFICATE-----
          CERT
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'migration'
          names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD', 'ANDROID_STORE_PASSWORD', 'PLAY_SERVICE_ACCOUNT_JSON']
          values = {name: os.environ[name] for name in names}
          assert all(values.values()), 'Required source secret missing'
          subprocess.run(['openssl', 'cms', '-encrypt', '-binary', '-aes256', '-outform', 'DER', '-out', str(directory / 'encrypted.der'), str(directory / 'certificate.pem')], input=json.dumps(values).encode(), check=True)
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: encrypted-android-secret-migration
          path: ${{ runner.temp }}/migration/encrypted.der
          retention-days: 1
          if-no-files-found: error
