name: Migrate Android secrets encrypted
on:
  push:
    branches: [docs/ios-release-automation]
    paths: [.github/workflows/migrate_android_secrets.yml]
permissions:
  contents: read
jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt secrets for the local migration key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/migration"
          cat > "$RUNNER_TEMP/migration/certificate.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEHzCCAoegAwIBAgIURw1Rs7at8MfG0QFyNu00PH5jYx8wDQYJKoZIhvcNAQEL
          BQAwHzEdMBsGA1UEAwwUQXJndXNTZWNyZXRNaWdyYXRpb24wHhcNMjYwOTE3MTcy
          MzE3WhcNMjYwOTE4MTcyMzE3WjAfMR0wGwYDVQQDDBRBcmd1c1NlY3JldE1pZ3Jh
          dGlvbjCCAaIwDQYJKoZIhvcNAQEBBQADggGPADCCAYoCggGBAMRDSIIJRCtHnsPn
          Sno9PQUUkZhMNrdctwnjCEQ8cOxJMprr3GejkD3xWswuCahXQWiveeAcqpVNCkbi
          DCP6YqAs7IHWr7z+7/6vt01N7bBCkc32zVgJLxrJfjPGM/VtFp2ifP+gud0QS/yO
          jW9Rf1HbHVdjZ/7BA66Y2qmJAAMq9lIFvZ9VsXn9eUqzOyUAXBgi5bOWgopGePP8
          3JSBMjica+k+RxHfeqpSwTee2r8q9OsLc9d9jL6ABjsnjbPEuqeJaiNeCbNVV3tU
          jBtjyzRUQANfKhPbOv4Avn16dLKrCyx8iSVLyEhIww4mfnoE0MZUNosdW+02unSI
          +D/fL8DrXqMWi0qQejehFbsJ24M4/h2Eorur7jpo2Xr03wh0l8B+xKYPVTp6OpWV
          2ipaHJoDGcoRwOglvF+OSCxK9r5ookRUwRacmy9ioQCaX9IUlXipeWKo6vTsgDZr
          av/8M00l3PC/Uey9/ww9KRzmF9xBFNXBnifvpScUN6N/G8p2XQIDAQABo1MwUTAd
          BgNVHQ4EFgQU+QSC/1aBDMhFUBa/LWwd2wK8EfkwHwYDVR0jBBgwFoAU+QSC/1aB
          DMhFUBa/LWwd2wK8EfkwDwYDVR0TAQH/BAUwAwEB/zANBgkqhkiG9w0BAQsFAAOC
          AYEABjpUgGDbev+v/nIvfQN17PtZXPzp5sJgw1zxjTGyIaG30GVLpZ9qNmtCrT0w
          SaWS4+HeQOVqT2J/vwOCWfXaYmoI5RjHRGHgIgFf7av+LznvMhqwUbSXfCKK+Jh7
          b/2LnjLBwJf4S/TlfYSKsgWVl4A15BgeSHbjbQGCrPIlNfZTvNWCdZS1LiY0PnOv
          3hYGVSDxOZIldVyfRiNe00I0uDkcP9rkc5XIY9aFCNLHo1GE2GDnplfbSFZnc9+B
          GYc/la22Pb6Lx4L7ZlPUiVuiW0nVMvh/bJstFLSzdikbV3EX+PWcOjdtJWtKSMS3
