name: iOS Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS Build
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Complete Xcode first-launch setup
        timeout-minutes: 5
        run: |
          sudo xcodebuild -runFirstLaunch
          xcodebuild -checkFirstLaunchStatus

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Identify Xcode cache version
        id: xcode-cache
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      # Cache downloaded dependencies only. Resolve and build on every run.
      - name: Cache iOS dependency downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-ios-deps-v1-${{ steps.xcode-cache.outputs.version }}-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock', 'pubspec.lock', 'ios/Runner.xcodeproj/project.pbxproj') }}

      - name: Get dependencies
        run: flutter pub get

      - name: Build simulator app and run all native XCTest
        run: |
          set -euo pipefail
          mkdir -p build/ios-native-tests
          python3 scripts/run_with_timeout.py 1080 python3 scripts/run_ios_build.py \
            2>&1 | tee build/ios-native-tests/run.log

      - name: Write native test summary
        if: always()
        run: |
          {
            echo '## iOS native XCTest'
            echo '```json'
            for report in simulator-boot.json timings.json test-results.json; do
              if [ -f "build/ios-native-tests/$report" ]; then cat "build/ios-native-tests/$report"; fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-native-test-results
          path: |
            build/ios-native-tests/*.json
            build/ios-native-tests/run.log
            build/ios-native-tests/boot-screen.png
            build/ios-native-tests/Tests.xcresult/
          retention-days: 14
          if-no-files-found: warn
