name: iOS Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS Build
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build simulator app and run all native XCTest
        run: |
          set -euo pipefail
          mkdir -p build/ios-native-tests
          python3 scripts/run_with_timeout.py 900 python3 scripts/run_ios_build.py \
            2>&1 | tee build/ios-native-tests/run.log

      - name: Write native test summary
        if: always()
        run: |
          {
            echo '## iOS native XCTest'
            echo '```json'
            for report in simulator-boot.json timings.json test-results.json; do
              if [ -f "build/ios-native-tests/$report" ]; then cat "build/ios-native-tests/$report"; fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-native-test-results
          path: |
            build/ios-native-tests/*.json
            build/ios-native-tests/run.log
            build/ios-native-tests/boot-screen.png
            build/ios-native-tests/Tests.xcresult/
          retention-days: 14
          if-no-files-found: warn
